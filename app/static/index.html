<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .cat-btn { transition: all 0.15s ease-in-out; user-select: none; }
        .cat-btn:active { transform: scale(0.96); }
    </style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Futter">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body class="min-h-screen pb-16">

    <!-- ========================================== -->
    <!-- HEADER & NAVIGATION                        -->
    <!-- ========================================== -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full sm:w-auto">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🐾</span>
                    <h1 class="text-xl font-bold tracking-tight text-white">Futter</h1>
                </div>
                <!-- Sprachumschalter (Mobil rechts oben) -->
                <button onclick="toggleLanguage()" id="lang-btn-mobile" class="sm:hidden px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                    🇩🇪 DE
                </button>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-center">
                <nav class="flex flex-wrap items-center gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800 w-full sm:w-auto justify-center">
                    <button onclick="switchTab('feed')" id="tab-btn-feed" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-blue-600 text-white transition"></button>
                    <button onclick="switchTab('vomit')" id="tab-btn-vomit" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition"></button>
                    <button onclick="switchTab('history')" id="tab-btn-history" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition"></button>
                    <button onclick="switchTab('stats')" id="tab-btn-stats" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition"></button>
                    <button onclick="switchTab('stammdaten')" id="tab-btn-stammdaten" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition"></button>
                </nav>
                <!-- Sprachumschalter (Desktop) -->
                <button onclick="toggleLanguage()" id="lang-btn-desktop" class="hidden sm:inline-flex px-3 py-2 rounded-xl text-xs font-semibold bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-800 transition shrink-0">
                    🇩🇪 DE
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-8">

        <!-- ========================================== -->
        <!-- TAB 1: FÜTTERUNG                           -->
        <!-- ========================================== -->
        <section id="tab-feed" class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <span>🥣</span> <span id="i18n-new-meal-title"></span>
                    </h2>
                    <span id="feed-toast" class="hidden text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-700 px-3 py-1 rounded-full"></span>
                </div>

                <form id="feeding-form" onsubmit="submitFeeding(event)" class="space-y-5">
                    <!-- Katzen-Auswahl -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label id="i18n-select-cats" class="text-xs font-medium text-slate-400 uppercase tracking-wider"></label>
                            <button type="button" onclick="selectAllCats()" id="i18n-toggle-all-cats" class="text-xs text-blue-400 hover:text-blue-300 font-medium"></button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="cat-buttons">
                            <!-- Dynamisch gefüllt -->
                        </div>
                    </div>

                    <!-- Kaskaden-Dropdown: Hersteller & Futter -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label id="i18n-label-manufacturer" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <select id="manufacturer-select" onchange="onManufacturerChange()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"></select>
                        </div>
                        <div>
                            <label id="i18n-label-food" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <select id="food-select" onchange="onFoodChange()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"></select>
                        </div>
                    </div>

                    <!-- Individuelle Bewertungen pro ausgewählter Katze -->
                    <div id="cat-ratings-container" class="space-y-3 bg-slate-950 border border-slate-800 p-4 rounded-xl">
                        <label id="i18n-label-cat-ratings" class="block text-xs font-medium text-slate-400 uppercase tracking-wider"></label>
                        <div id="cat-ratings-list" class="space-y-2.5"></div>
                    </div>

                    <!-- Zeitpunkt & Notiz -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label id="i18n-label-timestamp" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <input type="datetime-local" id="feeding-timestamp" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label id="i18n-label-notes" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <input type="text" id="feeding-notes" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button type="submit" id="i18n-btn-save-meal" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition shadow-md"></button>
                    </div>
                </form>
            </div>

            <!-- Kurze Vorschau der letzten 5 Fütterungsrunden -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex items-center justify-between mb-3">
                    <h3 id="i18n-recent-preview-title" class="text-sm font-semibold text-slate-300"></h3>
                    <button onclick="switchTab('history')" id="i18n-link-all-history" class="text-xs text-blue-400 hover:text-blue-300 font-medium"></button>
                </div>
                <div id="recent-feedings-preview" class="space-y-2.5"></div>
            </div>
        </section>


        <!-- ========================================== -->
        <!-- TAB 2: SPUCK-TRACKER                       -->
        <!-- ========================================== -->
        <section id="tab-vomit" class="hidden space-y-8">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <h2 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
                    <span>🚨</span> <span id="i18n-vomit-title"></span>
                </h2>

                <form id="vomit-form" onsubmit="submitVomit(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label id="i18n-vomit-which-cat" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <select id="vomit-cat" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500"></select>
                        </div>
                        <div>
                            <label id="i18n-vomit-timestamp-label" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <input type="datetime-local" id="vomit-timestamp" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label id="i18n-vomit-photo-label" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <input type="file" id="vomit-image" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                        </div>
                        <div>
                            <label id="i18n-vomit-notes-label" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                            <input type="text" id="vomit-notes" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-rose-500">
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button type="submit" id="i18n-btn-save-vomit" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition shadow-md"></button>
                    </div>
                </form>
            </div>

            <!-- Spuck-Historie inkl. 12h-Korrelation -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <span>🔍</span> <span id="i18n-vomit-history-title"></span>
                    </h2>
                    <label class="inline-flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
                        <input type="checkbox" id="hide-deleted-vomit" onchange="toggleHideDeletedCats(this.checked)" class="rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                        <span class="i18n-hide-deleted-label"></span>
                    </label>
                </div>
                <div id="vomits-list" class="space-y-4"></div>
            </div>
        </section>


        <!-- ========================================== -->
        <!-- TAB 3: HISTORIE (GRUPPIERTE FÜTTERUNGEN)   -->
        <!-- ========================================== -->
        <section id="tab-history" class="hidden space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex flex-col gap-3 mb-5 pb-4 border-b border-slate-800">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                                <span>📋</span> <span id="i18n-history-title"></span>
                            </h2>
                            <p id="i18n-history-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                        </div>
                        <label class="inline-flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
                            <input type="checkbox" id="hide-deleted-history" onchange="toggleHideDeletedCats(this.checked)" class="rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span class="i18n-hide-deleted-label"></span>
                        </label>
                    </div>
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0" id="history-filter-buttons"></div>
                </div>

                <div id="feedings-list" class="space-y-3"></div>
            </div>
        </section>


        <!-- ========================================== -->
        <!-- TAB 4: AUSWERTUNG & STATISTIK              -->
        <!-- ========================================== -->
        <section id="tab-stats" class="hidden space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="stats-kpi-cards"></div>

            <!-- Futter-Ranking -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex flex-col gap-3 mb-5 pb-4 border-b border-slate-800">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                                <span>🏆</span> <span id="i18n-stats-ranking-title"></span>
                            </h2>
                            <p id="i18n-stats-ranking-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                        </div>
                        <label class="inline-flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
                            <input type="checkbox" id="hide-deleted-stats" onchange="toggleHideDeletedCats(this.checked)" class="rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span class="i18n-hide-deleted-label"></span>
                        </label>
                    </div>
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0" id="stats-filter-buttons"></div>
                </div>

                <div id="stats-food-ranking" class="space-y-3"></div>
            </div>

            <!-- Spuck-Korrelation -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="mb-4 pb-3 border-b border-slate-800">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <span>⚠️</span> <span id="i18n-stats-radar-title"></span>
                    </h2>
                    <p id="i18n-stats-radar-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
                <div id="stats-vomit-triggers" class="space-y-2.5"></div>
            </div>
        </section>


        <!-- ========================================== -->
        <!-- TAB 5: STAMMDATEN (KATZEN, BEGRIFFE, FUTTER)-->
        <!-- ========================================== -->
        <section id="tab-stammdaten" class="hidden space-y-6">

            <!-- BEREICH 1: KATZEN VERWALTEN -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-800">
                    <div>
                        <h2 class="text-base font-semibold text-white flex items-center gap-2">
                            <span>🐱</span> <span id="i18n-stamm-cats-title"></span>
                        </h2>
                        <p id="i18n-stamm-cats-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                    </div>
                    <button onclick="promptNewCat()" id="i18n-btn-add-cat" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shrink-0"></button>
                </div>
                <div id="stammdaten-cats-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
            </div>

            <!-- BEREICH 2: BEWERTUNGS-BEGRIFFE EDITIEREN -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="mb-4 pb-3 border-b border-slate-800">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <span>🏷️</span> <span id="i18n-stamm-ratings-title"></span>
                    </h2>
                    <p id="i18n-stamm-ratings-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
                <form onsubmit="saveRatingLabels(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-emerald-400 mb-1">😍 Score 3 (Top)</label>
                        <input type="text" id="setting-rating-3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-blue-400 mb-1">😐 Score 2 (Standard)</label>
                        <input type="text" id="setting-rating-2" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-rose-400 mb-1">🤢 Score 1 (Flop)</label>
                        <input type="text" id="setting-rating-1" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-rose-500 focus:outline-none">
                    </div>
                    <div class="sm:col-span-3 flex items-center justify-end gap-3">
                        <span id="ratings-saved-toast" class="hidden text-xs text-emerald-400 font-semibold">✅</span>
                        <button type="submit" id="i18n-btn-save-ratings" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition"></button>
                    </div>
                </form>
            </div>

            <!-- BEREICH 3: HERSTELLER & FUTTERSORTEN -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-800">
                    <div>
                        <h2 class="text-base font-semibold text-white flex items-center gap-2">
                            <span>⚙️</span> <span id="i18n-stamm-food-title"></span>
                        </h2>
                        <p id="i18n-stamm-food-subtitle" class="text-xs text-slate-400 mt-1"></p>
                    </div>
                    <button onclick="promptNewManufacturerFromStammdaten()" id="i18n-btn-add-manufacturer" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shrink-0"></button>
                </div>

                <div id="stammdaten-list" class="space-y-4"></div>
            </div>
        </section>

    </main>


    <!-- ========================================== -->
    <!-- MODAL 1: ERST-SETUP (SPRACHE & KATZEN)     -->
    <!-- ========================================== -->
    <div id="setup-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl">
            <div class="flex items-center gap-2.5 border-b border-slate-800 pb-3">
                <span class="text-2xl">🐾</span>
                <div>
                    <h2 id="setup-title" class="text-lg font-bold text-white">Willkommen bei Futter!</h2>
                    <p id="setup-subtitle" class="text-xs text-slate-400">Bitte wähle deine Sprache und lege deine Katzen an.</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label id="setup-lang-label" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Sprache / Language</label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button type="button" onclick="setSetupLang('de')" id="setup-lang-de" class="py-2.5 px-3 rounded-xl border border-blue-500 bg-blue-950/70 text-blue-200 font-semibold text-sm">
                            🇩🇪 Deutsch
                        </button>
                        <button type="button" onclick="setSetupLang('en')" id="setup-lang-en" class="py-2.5 px-3 rounded-xl border border-slate-700 bg-slate-800/60 text-slate-300 font-medium text-sm">
                            🇬🇧 English
                        </button>
                    </div>
                </div>

                <div>
                    <label id="setup-cats-label" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Welche Katzen möchtest du verwalten?</label>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="setup-cat-input" placeholder="Name der Katze (z.B. Simsa)..." onkeydown="if(event.key==='Enter'){event.preventDefault();addSetupCat();}" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <button type="button" onclick="addSetupCat()" id="setup-add-cat-btn" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
                            + Hinzufügen
                        </button>
                    </div>
                    <div id="setup-cats-chips" class="flex flex-wrap gap-2 min-h-[36px] bg-slate-950 border border-slate-800/80 rounded-xl p-2.5"></div>
                </div>

                <button type="button" onclick="finishInitialSetup()" id="setup-finish-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md">
                    🚀 Starten
                </button>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- MODAL 2: GRUPPEN-FÜTTERUNG BEARBEITEN      -->
    <!-- ========================================== -->
    <div id="edit-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl my-8">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="i18n-edit-modal-title" class="text-base font-semibold text-white"></h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>

            <form id="edit-feeding-form" onsubmit="submitEditFeeding(event)" class="space-y-4">
                <input type="hidden" id="edit-batch-id">

                <div>
                    <label id="i18n-edit-cats-label" class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5"></label>
                    <div id="edit-cat-buttons" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3"></div>
                    <div id="edit-cat-ratings-list" class="space-y-2 bg-slate-950 border border-slate-800 p-3 rounded-xl"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label id="i18n-edit-man-label" class="block text-xs font-medium text-slate-400 mb-1"></label>
                        <select id="edit-manufacturer" onchange="populateEditFoods()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white"></select>
                    </div>
                    <div>
                        <label id="i18n-edit-food-label" class="block text-xs font-medium text-slate-400 mb-1"></label>
                        <select id="edit-food" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white"></select>
                    </div>
                </div>

        function getLocalDatetimeString() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        function formatDisplayDate(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            if (isNaN(d)) return isoStr;
            const locale = settings.language === 'en' ? 'en-GB' : 'de-DE';
            const suffix = settings.language === 'en' ? '' : ' Uhr';
            return d.toLocaleDateString(locale, { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
                   d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' }) + suffix;
        }

                return;

                const chip = document.createElement('span');
                chip.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-950 text-blue-200 border border-blue-700";

                container.appendChild(chip);
            });

            const input = document.getElementById('setup-cat-input');
            const val = input.value.trim();
            if (val && !setupCatsList.includes(val)) {
                setupCatsList.push(val);
                input.value = '';
                renderSetupCatChips();
            }
        }

        function removeSetupCat(idx) {
            setupCatsList.splice(idx, 1);
            renderSetupCatChips();

            if (setupCatsList.length === 0) {

            }
            const res = await fetch('/api/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ language: setupLang, cats: setupCatsList })
            });
            if (res.ok) {
                document.getElementById('setup-modal').classList.add('hidden');
                await loadAllData(true);
            }

        // --- DATEN VOM BACKEND LADEN ---
        async function loadAllData(selectAllOnInit = false) {
            const [setRes, catRes, manRes, foodRes, feedRes, vomitRes] = await Promise.all([
                fetch('/api/settings'),
                fetch('/api/cats'),
                fetch('/api/manufacturers'),
                fetch('/api/foods'),
                fetch('/api/feedings?limit=1000'),
                fetch('/api/vomits?limit=200')
            ]);
            settings = await setRes.json();
            cats = await catRes.json();
            manufacturers = await manRes.json();
            foods = await foodRes.json();
            allFeedings = await feedRes.json();
            vomits = await vomitRes.json();

            // Prüfen, ob Erst-Setup angezeigt werden soll
            if (settings.setup_completed === '0' && cats.length === 0) {
                renderSetupCatChips();
                document.getElementById('setup-modal').classList.remove('hidden');
            }

            const activeCatNames = cats.map(c => c.name);
            if (selectAllOnInit) {
                selectedCats = new Set(activeCatNames);
            } else {
                // Nicht mehr existierende Katzen aus der aktiven Auswahl entfernen
                selectedCats = new Set(Array.from(selectedCats).filter(c => activeCatNames.includes(c)));
            }

            activeCatNames.forEach(cName => {
                if (catRatingsState[cName] === undefined) {
                    catRatingsState[cName] = 2; // Standard: "Okay" (2)
                }
            });

            applyTranslations();
            renderAllViews();
        }

        function populateManufacturerSelect(selectedId = null) {
            const sel = document.getElementById('manufacturer-select');
            if (!sel) return;
            sel.innerHTML = '';

            manufacturers.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                sel.appendChild(opt);
            });

            const addOpt = document.createElement('option');
            addOpt.value = '__new__';
            addOpt.textContent = t('addNewManufacturerOpt');
            sel.appendChild(addOpt);

            if (selectedId && manufacturers.some(m => m.id == selectedId)) {
                sel.value = selectedId;
            } else if (manufacturers.length > 0) {
                sel.value = manufacturers[0].id;
            }

            lastValidManufacturerId = sel.value !== '__new__' ? parseInt(sel.value) : null;
            populateFoodSelect(lastValidFoodId);

        function populateFoodSelect(selectedFoodId = null) {
            const manId = parseInt(document.getElementById('manufacturer-select').value);
            const sel = document.getElementById('food-select');
            if (!sel) return;
            sel.innerHTML = '';

            const filtered = foods.filter(f => f.manufacturer_id === manId);
            filtered.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = f.name;
                sel.appendChild(opt);
            });

            const addOpt = document.createElement('option');
            addOpt.value = '__new__';
            addOpt.textContent = t('addNewFoodOpt');
            sel.appendChild(addOpt);

            if (selectedFoodId && filtered.some(f => f.id == selectedFoodId)) {
                sel.value = selectedFoodId;
            } else if (filtered.length > 0) {
                sel.value = filtered[0].id;
            }

            lastValidFoodId = sel.value !== '__new__' ? parseInt(sel.value) : null;
        }

        async function onManufacturerChange() {
            const sel = document.getElementById('manufacturer-select');
            if (sel.value === '__new__') {
                const name = prompt(t('promptNewManufacturer'));
                if (name && name.trim()) {
                    const res = await fetch('/api/manufacturers', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim() })
                    });
                    if (res.ok) {
                        const created = await res.json();
                        lastValidManufacturerId = created.id;
                        await loadAllData(false);
                        return;
                    }
                }
                if (lastValidManufacturerId) sel.value = lastValidManufacturerId;
            } else {
                lastValidManufacturerId = parseInt(sel.value);
                lastValidFoodId = null;
                populateFoodSelect();
            }
        }

        async function onFoodChange() {
            const sel = document.getElementById('food-select');
            const manId = parseInt(document.getElementById('manufacturer-select').value);
            if (sel.value === '__new__') {
                if (!manId || isNaN(manId)) return;
                const name = prompt(t('promptNewFood'));
                if (name && name.trim()) {
                    const res = await fetch('/api/foods', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ manufacturer_id: manId, name: name.trim() })
                    });
                    if (res.ok) {
                        const created = await res.json();
                        lastValidFoodId = created.id;
                        await loadAllData(false);
                        return;
                    }
                }
                if (lastValidFoodId) sel.value = lastValidFoodId;
            } else {
                lastValidFoodId = parseInt(sel.value);
            }
        }

        // --- FÜTTERUNG SPEICHERN ---
        async function submitFeeding(e) {
            e.preventDefault();
            if (selectedCats.size === 0) {
                alert(t('alertSelectCat'));
                return;
            }
            const manId = parseInt(document.getElementById('manufacturer-select').value);
            const foodId = parseInt(document.getElementById('food-select').value);
            if (!manId || !foodId || isNaN(manId) || isNaN(foodId)) {
                alert(t('alertSelectFood'));
                return;
            }

            const catRatingsPayload = {};
            selectedCats.forEach(cat => {
                catRatingsPayload[cat] = catRatingsState[cat] !== undefined ? catRatingsState[cat] : 2;
            });

            const payload = {
                cat_ratings: catRatingsPayload,
                manufacturer_id: manId,
                food_id: foodId,
                notes: document.getElementById('feeding-notes').value.trim(),
                timestamp: document.getElementById('feeding-timestamp').value
            };

            const res = await fetch('/api/feedings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('feeding-notes').value = '';
                document.getElementById('feeding-timestamp').value = getLocalDatetimeString();
                // Nach dem Speichern Bewertungen wieder auf Standard "Okay" (2) zurücksetzen
                cats.forEach(c => { catRatingsState[c.name] = 2; });
                const toast = document.getElementById('feed-toast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2500);
                await loadAllData(false);
            }
        }

        // --- GRUPPIERUNGS-LOGIK FÜR FÜTTERUNGEN ---
        function getGroupedFeedings(respectHideDeleted = true) {
            const activeSet = new Set(cats.map(c => c.name));
            const groupsMap = new Map();

            allFeedings.forEach(f => {
                if (respectHideDeleted && hideDeletedCats && !activeSet.has(f.cat_name)) {
                    return;
                }
                const bKey = f.batch_id ? f.batch_id : `single_${f.id}`;
                if (!groupsMap.has(bKey)) {
                    groupsMap.set(bKey, {
                        batch_id: bKey,
                        manufacturer_id: f.manufacturer_id,
                        food_id: f.food_id,
                        manufacturer_name: f.manufacturer_name,
                        food_name: f.food_name,
                        timestamp: f.timestamp,
                        notes: f.notes || '',
                        items: []
                    });
                }
                groupsMap.get(bKey).items.push({
                    id: f.id,
                    cat_name: f.cat_name,
                    rating: f.rating,
                    is_deleted_cat: !activeSet.has(f.cat_name)
                });
            });

            return Array.from(groupsMap.values());
        }

        function renderFilterButtons() {
            const activeSet = new Set(cats.map(c => c.name));
            const allKnownCats = new Set(cats.map(c => c.name));
            if (!hideDeletedCats) {
                allFeedings.forEach(f => { if (f.cat_name) allKnownCats.add(f.cat_name); });
            }
            const catList = Array.from(allKnownCats);

            if (currentCatFilter !== 'Alle' && !catList.includes(currentCatFilter)) currentCatFilter = 'Alle';
            if (statsCatFilter !== 'Alle' && !catList.includes(statsCatFilter)) statsCatFilter = 'Alle';

            // Historie Filter-Buttons
            const histContainer = document.getElementById('history-filter-buttons');
            if (histContainer) {
                histContainer.innerHTML = '';
                ['Alle', ...catList].forEach(c => {
                    const btn = document.createElement('button');
                    btn.onclick = () => { currentCatFilter = c; renderFilterButtons(); renderFeedingsHistory(); };
                    const isDeleted = c !== 'Alle' && !activeSet.has(c);
                    const label = c === 'Alle' ? t('allFilter') : (isDeleted ? `${c} (🗑️)` : c);
                    btn.className = (c === currentCatFilter)

                    btn.textContent = label;
                    histContainer.appendChild(btn);
                });

            const statsContainer = document.getElementById('stats-filter-buttons');
            if (statsContainer) {
                statsContainer.innerHTML = '';
                ['Alle', ...catList].forEach(c => {
                    const btn = document.createElement('button');
                    btn.onclick = () => { statsCatFilter = c; renderFilterButtons(); renderStats(); };
                    const isDeleted = c !== 'Alle' && !activeSet.has(c);
                    const label = c === 'Alle' ? t('allFilter') : (isDeleted ? `${c} (🗑️)` : c);
                    btn.className = (c === statsCatFilter)
                        ? "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shrink-0"
                        : "px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 hover:text-white shrink-0";
                    btn.textContent = label;
                    statsContainer.appendChild(btn);
                });
            }
        }

        // --- MODAL: GRUPPEN-FÜTTERUNG BEARBEITEN ---
        function openEditBatchModal(batchId) {
            // Ungefilterte Gruppe holen, damit alle beteiligten Katzen drin sind
            const allGroups = getGroupedFeedings(false);
            const g = allGroups.find(item => item.batch_id === batchId);
            if (!g) return;

            document.getElementById('edit-batch-id').value = g.batch_id;
            document.getElementById('edit-timestamp').value = g.timestamp.slice(0, 16);
            document.getElementById('edit-notes').value = g.notes || '';

            editSelectedCats = new Set();
            editCatRatingsState = {};
            const knownSet = new Set(cats.map(c => c.name));

            g.items.forEach(it => {
                knownSet.add(it.cat_name);
                editSelectedCats.add(it.cat_name);
                editCatRatingsState[it.cat_name] = it.rating;
            });
            editAllKnownCats = Array.from(knownSet);

            const manSel = document.getElementById('edit-manufacturer');
            manSel.innerHTML = '';
            manufacturers.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                manSel.appendChild(opt);
            });
            if (g.manufacturer_id) manSel.value = g.manufacturer_id;

            populateEditFoods(g.food_id);
            renderEditModalCats();
            document.getElementById('edit-modal').classList.remove('hidden');
        }

                : vomits;

            if (filteredVomits.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic py-4 text-center">${t('noVomitsYet')}</p>`;
                return;
            }

            filteredVomits.forEach(v => {
                let correlationHtml = '';
                if (v.recent_feedings && v.recent_feedings.length > 0) {
                    const items = v.recent_feedings.map(rf =>
                        `<li class="text-xs text-amber-200/90">• <strong>${rf.cat_name}</strong>: ${rf.manufacturer_name} – ${rf.food_name} <span class="text-slate-400">(${formatDisplayDate(rf.timestamp)})</span></li>`
                    ).join('');
                    correlationHtml = `
                        <div class="mt-2.5 bg-amber-950/40 border border-amber-800/50 rounded-lg p-2.5">
                            <p class="text-xs font-semibold text-amber-300 mb-1">${t('feedings12hBefore')}</p>
                            <ul class="space-y-1">${items}</ul>
                        </div>
                    `;
                } else {
                    correlationHtml = `
                        <div class="mt-2 text-xs text-slate-500 italic">
                            ${t('noFeedings12hBefore')}
                        </div>
                    `;
                }

                const displayCat = v.cat_name === 'Unbekannt' ? t('unknownCat') : v.cat_name;
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row justify-between gap-4";
                card.innerHTML = `
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm text-rose-400">🤮 ${displayCat}</span>
                                <span class="text-xs text-slate-400">🕒 ${formatDisplayDate(v.timestamp)}</span>
                            </div>
                            <button onclick="deleteVomit(${v.id})" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 rounded bg-slate-900 border border-slate-800">
                                🗑️
                            </button>
                        </div>
                        ${v.notes ? `<p class="text-xs text-slate-200 mt-1">💬 "${v.notes}"</p>` : ''}
                        ${correlationHtml}
                    </div>
                    ${v.image_path ? `
                        <a href="${v.image_path}" target="_blank" class="shrink-0">
                            <img src="${v.image_path}" alt="Spuck-Foto" class="w-24 h-24 object-cover rounded-lg border border-slate-700 hover:opacity-90 transition">
                        </a>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function deleteVomit(id) {
            if (!confirm(t('confirmDeleteVomit'))) return;
            await fetch(`/api/vomits/${id}`, { method: 'DELETE' });
            await loadAllData(false);
        }

        // --- TAB 4: AUSWERTUNG & STATISTIK ---
        function renderStats() {
            const kpiContainer = document.getElementById('stats-kpi-cards');
            const rankingContainer = document.getElementById('stats-food-ranking');
            const triggerContainer = document.getElementById('stats-vomit-triggers');
            if (!kpiContainer || !rankingContainer || !triggerContainer) return;

            const activeSet = new Set(cats.map(c => c.name));
            let baseFeedings = hideDeletedCats
                ? allFeedings.filter(f => activeSet.has(f.cat_name))
                : allFeedings;

            const filteredFeedings = statsCatFilter === 'Alle'
                ? baseFeedings
                : baseFeedings.filter(f => f.cat_name === statsCatFilter);

            const totalMeals = filteredFeedings.length;
            const avgScore = totalMeals > 0
                ? (filteredFeedings.reduce((acc, x) => acc + x.rating, 0) / totalMeals).toFixed(2)
                : '–';

            let baseVomits = hideDeletedCats
                ? vomits.filter(v => v.cat_name === 'Unbekannt' || activeSet.has(v.cat_name))
                : vomits;
            const totalVomits = statsCatFilter === 'Alle'
                ? baseVomits.length
                : baseVomits.filter(v => v.cat_name === statsCatFilter).length;

            const filterLabel = statsCatFilter === 'Alle' ? t('allFilter') : statsCatFilter;

            kpiContainer.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-slate-400 uppercase">${t('kpiMeals')} (${filterLabel})</p>
                    <p class="text-2xl font-bold text-white mt-1">${totalMeals}</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-slate-400 uppercase">${t('kpiAvg')}</p>
                    <p class="text-2xl font-bold text-emerald-400 mt-1">${avgScore} <span class="text-xs text-slate-400 font-normal">/ 3.00</span></p>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-slate-400 uppercase">${t('kpiVomits')} (${filterLabel})</p>
                    <p class="text-2xl font-bold text-rose-400 mt-1">${totalVomits}</p>
                </div>
            `;

            const foodStats = {};
            filteredFeedings.forEach(f => {
                const key = `${f.manufacturer_name} – ${f.food_name}`;
                if (!foodStats[key]) {
                    foodStats[key] = { label: key, count: 0, sumRating: 0, loved: 0, ok: 0, refused: 0 };
                }
                foodStats[key].count++;
                foodStats[key].sumRating += f.rating;
                if (f.rating === 3) foodStats[key].loved++;
                if (f.rating === 2) foodStats[key].ok++;
                if (f.rating === 1) foodStats[key].refused++;
            });

            const sortedFoods = Object.values(foodStats).sort((a, b) => {
                const avgA = a.sumRating / a.count;
                const avgB = b.sumRating / b.count;
                if (avgB !== avgA) return avgB - avgA;
                return b.count - a.count;
            });

            if (sortedFoods.length === 0) {
                rankingContainer.innerHTML = `<p class="text-xs text-slate-500 italic py-4 text-center">${t('noHistoryFound')}</p>`;
            } else {
                rankingContainer.innerHTML = '';
                sortedFoods.forEach(item => {
                    const avg = (item.sumRating / item.count).toFixed(1);
                    const pct = Math.round(((item.sumRating / item.count) / 3) * 100);
                    const barColor = avg >= 2.5 ? 'bg-emerald-500' : (avg >= 1.8 ? 'bg-blue-500' : 'bg-rose-500');

                    const div = document.createElement('div');
                    div.className = "bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2";
                    div.innerHTML = `
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="font-semibold text-sm text-white">${item.label}</span>
                            <div class="flex items-center gap-2 text-xs">
                                <span class="text-emerald-400">😍 ${item.loved}x</span>
                                <span class="text-blue-400">😐 ${item.ok}x</span>
                                <span class="text-rose-400">🤢 ${item.refused}x</span>
                                <span class="bg-slate-800 text-slate-200 px-2 py-0.5 rounded font-semibold">Ø ${avg} / 3</span>
                            </div>
                        </div>
                        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                            <div class="${barColor} h-full rounded-full" style="width: ${pct}%"></div>
                        </div>
                    `;
                    rankingContainer.appendChild(div);
                });
            }

            const triggerCounts = {};
            baseVomits.forEach(v => {
                if (statsCatFilter !== 'Alle' && v.cat_name !== statsCatFilter && v.cat_name !== 'Unbekannt') return;
                if (v.recent_feedings && v.recent_feedings.length > 0) {
                    const uniqueInEvent = new Set();
                    v.recent_feedings.forEach(rf => {
                        if (statsCatFilter === 'Alle' || rf.cat_name === statsCatFilter) {
                            uniqueInEvent.add(`${rf.manufacturer_name} – ${rf.food_name}`);
                        }
                    });
                    uniqueInEvent.forEach(foodKey => {
                        triggerCounts[foodKey] = (triggerCounts[foodKey] || 0) + 1;
                    });
                }
            });

            const sortedTriggers = Object.entries(triggerCounts).sort((a, b) => b[1] - a[1]);
            if (sortedTriggers.length === 0) {
                triggerContainer.innerHTML = `<p class="text-xs text-slate-500 italic py-3 text-center">${t('noVomitTriggers')}</p>`;
            } else {
                triggerContainer.innerHTML = '';
                sortedTriggers.forEach(([foodLabel, count]) => {
                    const row = document.createElement('div');
                    row.className = "bg-rose-950/20 border border-rose-900/50 rounded-xl px-3.5 py-2.5 flex items-center justify-between";
                    row.innerHTML = `
                        <span class="text-sm font-medium text-rose-200">${foodLabel}</span>
                        <span class="text-xs font-bold bg-rose-900/70 text-rose-200 px-2.5 py-1 rounded-lg">
                            ${count}${t('fedBeforeVomit')}
                        </span>
                    `;
                    triggerContainer.appendChild(row);
                });
            }
        }

        // --- TAB 5: STAMMDATEN (KATZEN, BEGRIFFE, HERSTELLER & FUTTER) ---
        function renderStammdaten() {
            // 1. Katzen-Liste
            const catsContainer = document.getElementById('stammdaten-cats-list');
            if (catsContainer) {
                catsContainer.innerHTML = '';
                if (cats.length === 0) {
                    catsContainer.innerHTML = `<p class="text-xs text-slate-500 italic col-span-2">${t('noCatsHint')}</p>`;
                } else {
                    cats.forEach(c => {
                        const safeName = c.name.replace(/'/g, "\\'");
                        const div = document.createElement('div');
                        div.className = "bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 flex items-center justify-between";
                        div.innerHTML = `
                            <span class="font-semibold text-sm text-white flex items-center gap-2">🐱 ${c.name}</span>
                            <div class="flex items-center gap-1.5">
                                <button onclick="editCat(${c.id}, '${safeName}')" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition">
                                    ${t('btnRename')}
                                </button>
                                <button onclick="deleteCat(${c.id})" class="px-2.5 py-1 text-xs bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-900/50 rounded-lg transition">
                                    ${t('btnDelete')}
                                </button>
                            </div>
                        `;
                        catsContainer.appendChild(div);
                    });
                }
            }

            // 2. Hersteller & Futter
            const container = document.getElementById('stammdaten-list');
            if (!container) return;
            container.innerHTML = '';

            manufacturers.forEach(man => {
                const manFoods = foods.filter(f => f.manufacturer_id === man.id);
                const safeManName = man.name.replace(/'/g, "\\'");

                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3";

                let foodsHtml = '';
                if (manFoods.length === 0) {
                    foodsHtml = `<p class="text-xs text-slate-500 italic">${t('noFoodsForMan')}</p>`;
                } else {
                    foodsHtml = '<ul class="space-y-1.5">';
                    manFoods.forEach(food => {
                        const safeFoodName = food.name.replace(/'/g, "\\'");
                        foodsHtml += `
                            <li class="flex items-center justify-between bg-slate-900/70 px-3 py-2 rounded-lg border border-slate-800/60">
                                <span class="text-sm text-slate-200">${food.name}</span>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="editFood(${food.id}, '${safeFoodName}', ${man.id})" class="px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md transition">
                                        ${t('btnRename')}
                                    </button>
                                    <button onclick="deleteFood(${food.id})" class="px-2 py-1 text-xs bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-900/50 rounded-md transition">
                                        ${t('btnDelete')}
                                    </button>
                                </div>
                            </li>
                        `;
                    });
                    foodsHtml += '</ul>';
                }

                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-2.5 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-blue-400 text-sm sm:text-base">${man.name}</span>
                            <span class="text-xs bg-slate-900 text-slate-400 px-2 py-0.5 rounded-full border border-slate-800">${manFoods.length} ${t('varietiesCount')}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="promptNewFoodFromStammdaten(${man.id})" class="px-2.5 py-1 text-xs bg-blue-950/70 hover:bg-blue-900 text-blue-300 border border-blue-800/60 rounded-lg transition">
                                ${t('btnAddFood')}
                            </button>
                            <button onclick="editManufacturer(${man.id}, '${safeManName}')" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition">
                                ${t('btnRename')}
                            </button>
                            <button onclick="deleteManufacturer(${man.id})" class="px-2.5 py-1 text-xs bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-900/50 rounded-lg transition">
                                ${t('btnDelete')}
                            </button>
                        </div>
                    </div>
                    ${foodsHtml}
                `;
                container.appendChild(card);
            });
        }

        async function promptNewCat() {
            const name = prompt(t('promptNewCat'));
            if (!name || !name.trim()) return;
            const res = await fetch('/api/cats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim() })
            });
            if (res.ok) {
                selectedCats.add(name.trim());
                await loadAllData(false);
            }
        }

        async function editCat(id, currentName) {
            const newName = prompt(t('promptRenameCat'), currentName);
            if (!newName || !newName.trim() || newName.trim() === currentName) return;
            const res = await fetch(`/api/cats/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName.trim() })
            });
            if (res.ok) {
                if (selectedCats.has(currentName)) {
                    selectedCats.delete(currentName);
                    selectedCats.add(newName.trim());
                }
                await loadAllData(false);
            }
        }

        async function deleteCat(id) {
            if (!confirm(t('confirmDeleteCat'))) return;
            const res = await fetch(`/api/cats/${id}`, { method: 'DELETE' });
            if (res.ok) await loadAllData(false);
        }

        async function saveRatingLabels(e) {
            e.preventDefault();
            const r3 = document.getElementById('setting-rating-3').value.trim();
            const r2 = document.getElementById('setting-rating-2').value.trim();
            const r1 = document.getElementById('setting-rating-1').value.trim();
            if (!r3 || !r2 || !r1) return;

            const res = await fetch('/api/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rating_3: r3, rating_2: r2, rating_1: r1 })
            });
            if (res.ok) {
                settings = await res.json();
                const toast = document.getElementById('ratings-saved-toast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
                renderAllViews();
            }
        }

        async function promptNewManufacturerFromStammdaten() {
            const name = prompt(t('promptNewManufacturer'));
            if (!name || !name.trim()) return;
            const res = await fetch('/api/manufacturers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim() })
            });
            if (res.ok) await loadAllData(false);
        }

        async function promptNewFoodFromStammdaten(manId) {
            const name = prompt(t('promptNewFood'));
            if (!name || !name.trim()) return;
            const res = await fetch('/api/foods', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ manufacturer_id: manId, name: name.trim() })
            });
            if (res.ok) await loadAllData(false);
        }

        async function editManufacturer(id, currentName) {
            const newName = prompt(t('promptRenameManufacturer'), currentName);
            if (!newName || !newName.trim() || newName.trim() === currentName) return;
            const res = await fetch(`/api/manufacturers/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName.trim() })
            });
            if (res.ok) await loadAllData(false);
        }

        async function deleteManufacturer(id) {
            if (!confirm(t('confirmDeleteMan'))) return;
            const res = await fetch(`/api/manufacturers/${id}`, { method: 'DELETE' });
            if (res.ok) await loadAllData(false);
        }

        async function editFood(id, currentName, manufacturerId) {
            const newName = prompt(t('promptRenameFood'), currentName);
            if (!newName || !newName.trim() || newName.trim() === currentName) return;
            const res = await fetch(`/api/foods/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName.trim(), manufacturer_id: manufacturerId })
            });
            if (res.ok) await loadAllData(false);
        }

        async function deleteFood(id) {
            if (!confirm(t('confirmDeleteFood'))) return;
            const res = await fetch(`/api/foods/${id}`, { method: 'DELETE' });
            if (res.ok) await loadAllData(false);
        }

        // --- INITIALISIERUNG ---
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('feeding-timestamp').value = getLocalDatetimeString();
            document.getElementById('vomit-timestamp').value = getLocalDatetimeString();
            ['hide-deleted-history', 'hide-deleted-vomit', 'hide-deleted-stats'].forEach(id => {
                const cb = document.getElementById(id);
                if (cb) cb.checked = hideDeletedCats;
            });
            loadAllData(true);
        });
    </script>
